[project]
name = "checkyouraqi"
version = "0.1.0"
description = "Air quality forecasting and alerting platform for India (Delhi NCR v1)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "boto3>=1.43.103",
    "duckdb>=1.5.6",
    "lightgbm>=4.7.0",
    "scikit-learn>=1.9.1",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "mlflow>=3.16.1",
    "evidently>=0.7.23",
    "streamlit>=1.64.0",
    "folium>=0.20.0",
    "streamlit-folium>=0.27.4",
    "fastapi>=0.141.1",
    "mangum>=0.22.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "pre-commit>=3.7",
    "uvicorn>=0.54.0",
]

[tool.uv]
# Editable installs of the project are skipped (hidden .pth bug on this machine);
# run code with PYTHONPATH=. instead.
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Inline fixture data reads better unwrapped; production code keeps the 100-char limit.
"tests/**" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
