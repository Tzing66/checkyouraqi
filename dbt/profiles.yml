# No secrets here: the bucket comes from the environment (repo .env, via scripts/dbt.sh). AWS
# credentials follow boto3's default chain: AWS_PROFILE locally (.env), the instance role on EC2,
# OIDC on GitHub Actions, so no profile name is pinned here.
checkyouraqi:
  target: dev
  outputs:
    dev:
      type: athena
      region_name: ap-south-1
      work_group: checkyouraqi
      database: awsdatacatalog
      schema: aqi_silver
      s3_staging_dir: "s3://{{ env_var('DATA_BUCKET') }}/athena-results/"
      s3_data_dir: "s3://{{ env_var('DATA_BUCKET') }}/lake/"
      s3_data_naming: schema_table_unique
      threads: "{{ env_var('DBT_THREADS', '4') | int }}"
      num_retries: 2
