version: 2

sources:
  - name: bronze
    schema: aqi_bronze
    description: Raw landed files (external tables created by `run-operation create_bronze_tables`).
    tables:
      - name: openaq_pm25_hours
        description: Hourly DAG, trailing-6h PM2.5 hourly aggregates per station (map keyed by location id).
      - name: openaq_pm25_history
        description: Backfill, one file per station-month of PM2.5 hourly aggregates.
      - name: openaq_latest
        description: Hourly DAG, latest value of every sensor per station (includes dead sensors).
        config:
          # Plan §6: measurements < 3h old warn, < 6h error. Measures when PM2.5 was actually
          # sampled (newest reading), not when we fetched, scanning only the last 6 hours of
          # snapshots (each hourly snapshot carries every sensor's newest reading).
          freshness:
            warn_after: {count: 3, period: hour}
            error_after: {count: 6, period: hour}
          loaded_at_query: >
            select max(from_iso8601_timestamp(r.m.datetime.utc))
            from aqi_bronze.openaq_latest
            cross join unnest(stations) as s (location_id, pages)
            cross join unnest(s.pages) as p (page)
            cross join unnest(page.results) as r (m)
            where {{ hours_ago_partition_filter(6) }}
      - name: openmeteo_forecasts
        description: Hourly weather forecast per zone point, with forecast_issued_at.
        config:
          freshness:
            warn_after: {count: 2, period: hour}
            error_after: {count: 6, period: hour}
          loaded_at_query: >
            select max(from_iso8601_timestamp(forecast_issued_at))
            from aqi_bronze.openmeteo_forecasts
            where {{ hours_ago_partition_filter(6) }}
      - name: openmeteo_air_quality_forecasts
        description: Hourly CAMS PM2.5/PM10 forecast per zone point, with forecast_issued_at.
      - name: openmeteo_actuals
        description: ERA5 observed weather, date-range files (overlapping; latest fetch wins).
      - name: openmeteo_previous_runs
        description: Historical forecasts as issued 1/2/3 days before each hour (leak-free features).
      - name: openmeteo_air_quality
        description: CAMS PM2.5/PM10 history (best estimate per hour; only usable lagged).
      - name: predictions
        description: Live forecasts written by the predict DAG (ml/predict.py), one file per issue hour.
      - name: firms_fires
        description: VIIRS fire detections, one CSV per day and source (SNPP/NOAA20 x SP/NRT).
        config:
          freshness:
            warn_after: {count: 2, period: day}
            error_after: {count: 4, period: day}
          loaded_at_query: >
            select max(cast(date_parse(dt, '%Y-%m-%d') as timestamp))
            from aqi_bronze.firms_fires
            where dt >= date_format(current_date - interval '7' day, '%Y-%m-%d')
