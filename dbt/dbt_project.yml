name: checkyouraqi
version: "0.1.0"
profile: checkyouraqi
config-version: 2

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
target-path: target
# Overridable so the read-only mount in Airflow can install packages under /tmp.
packages-install-path: "{{ env_var('DBT_PACKAGES_INSTALL_PATH', 'dbt_packages') }}"
clean-targets: [target, dbt_packages]

vars:
  # Mirrors config/freshness.yaml (tests/test_config.py checks they match).
  freshness_live_max_hours: 3
  freshness_delayed_max_hours: 6
  freshness_inactive_max_days: 7
  feed_outage_min_share_not_live: 0.8
  feed_degraded_min_share_not_live: 0.3
  # Valid PM2.5 range (plan §6); outside it values are flagged and excluded from training.
  pm25_min: 0
  pm25_max: 1000
  # An OpenAQ hour built from < this % of its expected 15-min readings is flagged low-coverage.
  min_hour_coverage_pct: 50
  # Same PM2.5 value this many hours running = stuck sensor.
  flatline_hours: 6
  # CPCB: a 24h average needs at least 16 valid hours.
  min_hours_for_24h_avg: 16
  # --- Phase 3 features (see docs/decisions.md 2026-09-29 Phase 3) ---
  forecast_horizons: [24, 48, 72]
  # Training rows: one prediction time every N hours per station (memory budget).
  feature_issue_every_hours: 3
  # Weather model runs publish a few hours after initialisation.
  weather_publish_lag_hours: 6
  cams_lag_hours: 12
  firms_publish_lag_hours: 3
  # Delhi NCR reference point for fire distance/bearing (Connaught Place).
  city_center_lat: 28.6315
  city_center_lon: 77.2167

# Run cadence (docs/decisions.md 2026-10-01): each model runs only as often as its inputs
# change (tags are explicit per model: dbt tags are additive, so no folder-wide defaults),
# change, because S3 request charges per build, not storage, dominate the S3 bill.
#   hourly  - live PM2.5/readings/forecasts and everything the dashboard and prediction need
#   daily   - inputs that update once a day (ERA5, previous runs, CAMS history, fires) + dims
#   weekly  - the training table (built by the GitHub Actions training workflow)
#   predict - forecast tables (predict DAG)
# See selectors.yml.
models:
  checkyouraqi:
    +table_type: iceberg
    staging:
      +schema: aqi_silver
      stg_openaq__pm25_hourly: {+tags: [hourly]}
      stg_openaq__latest_readings: {+tags: [hourly]}
      stg_openmeteo__weather_forecasts: {+tags: [hourly]}
      stg_openmeteo__air_quality_forecasts: {+tags: [hourly]}
      stg_openmeteo__weather_actuals: {+tags: [daily]}
      stg_openmeteo__weather_previous_runs: {+tags: [daily]}
      stg_openmeteo__air_quality: {+tags: [daily]}
      stg_firms__fire_points: {+tags: [daily]}
      stg_predictions: {+tags: [predict]}
    intermediate:
      +schema: aqi_silver
      int_station_hourly: {+tags: [hourly]}
      int_fire_points_located: {+tags: [daily]}
      int_fires_upwind_daily: {+tags: [daily]}
      int_fires_sector_rolling: {+tags: [daily]}
    marts:
      +schema: aqi_gold
      fct_aqi_hourly: {+tags: [hourly]}
      agg_zone_hourly: {+tags: [hourly]}
      agg_city_hourly: {+tags: [hourly]}
      fct_station_status: {+tags: [hourly]}
      fct_feed_status: {+tags: [hourly]}
      fct_features_live: {+tags: [hourly]}
      dim_date: {+tags: [daily]}
      dim_city: {+tags: [daily]}
      dim_zone: {+tags: [daily]}
      dim_station: {+tags: [daily]}
      agg_city_daily: {+tags: [daily]}
      fct_features_hourly: {+tags: [weekly]}
      fct_forecasts: {+tags: [predict]}
      fct_forecast_accuracy: {+tags: [predict]}

seeds:
  checkyouraqi:
    +schema: aqi_silver
    +tags: [daily]
