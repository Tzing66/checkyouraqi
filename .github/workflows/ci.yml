# Checks on every push and pull request: lint, tests, dbt project validity, Terraform validity.
# Needs no AWS access or secrets: dbt only parses (no Athena connection) and Terraform validates
# without its S3 backend. Deploys stay manual (plan -> review -> apply).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - name: Shell scripts parse
        run: for f in scripts/*.sh; do bash -n "$f"; done

  dbt:
    name: dbt parse
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATA_BUCKET: ci-placeholder # parse never connects; the profile only needs a value
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv tool install dbt-core==1.12.5 --with dbt-athena==1.11.1
      - working-directory: dbt
        run: |
          dbt deps --profiles-dir .
          dbt parse --profiles-dir . --no-use-colors

  terraform:
    name: terraform fmt + validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.16"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
